name: MISH Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Self-test CLI
        run: python mish_lab.py selftest

      - name: Validate PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './mish-lab.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          'MISH_LAB_POWERSHELL_PARSE=PASS'

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build ready Android probe
        run: gradle --no-daemon -p templates/android-device-facts :app:assembleDebug

      - name: Package ready probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp templates/android-device-facts/app/build/outputs/apk/debug/app-debug.apk dist/mish-lab-device-facts.apk
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('dist/mish-lab-device-facts.apk')
          manifest = {
              'schema': 'mish.lab-probe/v1',
              'lab_sha': os.environ['GITHUB_SHA'],
              'package': 'com.mobileproxymish.lab.devicefacts',
              'activity': 'com.mobileproxymish.lab.devicefacts/.MainActivity',
              'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
          }
          Path('dist/probe.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print('READY_PROBE_SHA256=' + manifest['sha256'])
          PY

      - name: Upload ready probe
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mish-lab-ready-probe
          path: dist/
          retention-days: 30
