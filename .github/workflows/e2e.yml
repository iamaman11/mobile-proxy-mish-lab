name: MISH Lab E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mish_lab.py'
      - 'mish-lab.ps1'
      - 'templates/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  emulator-e2e:
    runs-on: ubuntu-latest
    env:
      MISH_LAB_ROOT: ${{ runner.temp }}/mish-lab
    steps:
      - name: Checkout LAB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.6.0'

      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch task and exact product inputs
        run: python mish_lab.py work 2

      - name: Build LAB Android application
        run: python mish_lab.py probe build

      - name: Run probe on Android 11 and submit result
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          script: |
            python mish_lab.py probe run
            python mish_lab.py status
            python mish_lab.py submit
