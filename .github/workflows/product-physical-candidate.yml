name: Product Physical Candidate

run-name: PRODUCT physical candidate from LAB task #${{ github.event.issue.number }}

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: >-
      startsWith(github.event.issue.title, '[LAB TASK') &&
      contains(github.event.issue.body, 'product_physical_e3')
    runs-on: ubuntu-latest
    outputs:
      task_id: ${{ steps.task.outputs.task_id }}
      source_sha: ${{ steps.task.outputs.source_sha }}
      artifact_name: ${{ steps.task.outputs.artifact_name }}
    steps:
      - name: Parse bounded PRODUCT physical task
        id: task
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          body = os.environ.get("ISSUE_BODY", "")
          blocks = re.findall(r"```(?:json)?\s*(\{.*?\})\s*```", body, flags=re.DOTALL | re.IGNORECASE)
          task = None
          for block in blocks:
              try:
                  candidate = json.loads(block)
              except json.JSONDecodeError:
                  continue
              if isinstance(candidate, dict) and candidate.get("schema") == "mish.lab-task/v1":
                  task = candidate
                  break
          if task is None:
              raise SystemExit("LAB task JSON block not found")
          if task.get("operation") != "research.manual" or task.get("execution") != "product_physical_e3":
              raise SystemExit("issue is not a product_physical_e3 task")
          task_id = task.get("task_id")
          if not isinstance(task_id, str) or re.fullmatch(r"LAB-[0-9]{4}", task_id) is None:
              raise SystemExit("invalid task_id")
          product = task.get("product")
          if not isinstance(product, dict) or product.get("repo") != "iamaman11/mobile-proxy-mish":
              raise SystemExit("PRODUCT repo must be iamaman11/mobile-proxy-mish")
          source_sha = product.get("source_sha")
          if not isinstance(source_sha, str) or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("product.source_sha must be an exact lowercase commit SHA")
          artifact_name = f"mish-product-e3-{task_id}-{source_sha}"
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"task_id={task_id}\n")
              handle.write(f"source_sha={source_sha}\n")
              handle.write(f"artifact_name={artifact_name}\n")
          PY

      - name: Checkout exact PRODUCT source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iamaman11/mobile-proxy-mish
          ref: ${{ steps.task.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Verify source belongs to main and exact main CI passed
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.task.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git -C product rev-parse HEAD)"
          [[ "$ACTUAL" == "$SOURCE_SHA" ]]
          git -C product fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git -C product merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          sha = os.environ["SOURCE_SHA"]
          query = urllib.parse.urlencode({
              "head_sha": sha,
              "event": "push",
              "status": "success",
              "per_page": "100",
          })
          url = f"https://api.github.com/repos/iamaman11/mobile-proxy-mish/actions/runs?{query}"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "mobile-proxy-mish-lab-candidate-builder",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          matches = [
              run for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == sha
              and run.get("head_branch") == "main"
              and run.get("path") == ".github/workflows/ci.yml"
              and run.get("conclusion") == "success"
          ]
          if not matches:
              raise SystemExit(f"no successful exact-main CI run for {sha}")
          print(f"PRODUCT_EXACT_MAIN_CI_RUN_ID={matches[0]['id']}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle 9.6
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Install pinned Rust Android tooling
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ABI="$(sed -n 's/^mishTargetAbi=//p' product/android/gradle.properties)"
          case "$TARGET_ABI" in
            armeabi-v7a) RUST_TARGET='armv7-linux-androideabi' ;;
            arm64-v8a) RUST_TARGET='aarch64-linux-android' ;;
            *) echo "Unsupported mishTargetAbi: $TARGET_ABI" >&2; exit 1 ;;
          esac
          rustup toolchain install 1.98.1 --profile minimal
          (cd product && rustup override set 1.98.1)
          rustup target add "$RUST_TARGET"
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "MISH_TARGET_ABI=$TARGET_ABI" >> "$GITHUB_ENV"
          echo "MISH_RUST_TARGET=$RUST_TARGET" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK exactly like PRODUCT CI
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_PATH="$SDK_ROOT/ndk/29.0.14206865"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;29.0.14206865"
          test -d "$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Build exact PRODUCT and matching physical E3 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p product/android \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Verify and package exact candidate pair
        id: package
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.task.outputs.source_sha }}
          TASK_ID: ${{ steps.task.outputs.task_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          PRODUCT="product/android/app/build/outputs/apk/debug/app-debug.apk"
          TEST="product/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          NATIVE="product/android/app/build/generated/rust-jni/$MISH_TARGET_ABI/libmish_android_ffi.so"
          test -f "$PRODUCT"
          test -f "$TEST"
          test -f "$NATIVE"
          unzip -l "$PRODUCT" | grep -q "lib/$MISH_TARGET_ABI/libmish_android_ffi.so"
          unzip -l "$PRODUCT" | grep -q "lib/$MISH_TARGET_ABI/libjnidispatch.so"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$PRODUCT" | grep -q "package: name='com.mobileproxymish.app'"
          "$AAPT" dump badging "$TEST" | grep -q "package: name='com.mobileproxymish.app.test'"
          "$APKSIGNER" verify "$PRODUCT"
          "$APKSIGNER" verify "$TEST"

          mkdir -p dist
          cp "$PRODUCT" dist/app-debug.apk
          cp "$TEST" dist/app-debug-androidTest.apk

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          product = Path("dist/app-debug.apk")
          test = Path("dist/app-debug-androidTest.apk")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          sdk_root = os.environ.get("ANDROID_SDK_ROOT") or os.environ["ANDROID_HOME"]
          apksigner = Path(sdk_root) / "build-tools" / "36.0.0" / "apksigner"

          def cert_sha(path: Path) -> str:
              completed = subprocess.run(
                  [str(apksigner), "verify", "--print-certs", str(path)],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              match = re.search(r"certificate SHA-256 digest:\s*([0-9a-fA-F]+)", completed.stdout)
              if not match:
                  raise SystemExit(f"certificate SHA-256 digest missing for {path}")
              return match.group(1).lower()

          product_cert = cert_sha(product)
          test_cert = cert_sha(test)
          if product_cert != test_cert:
              raise SystemExit("PRODUCT and androidTest signing certificates differ")

          manifest = {
              "schema": "mish.product-physical-candidate/v1",
              "task_id": os.environ["TASK_ID"],
              "issue_number": int(os.environ["ISSUE_NUMBER"]),
              "source_repo": "iamaman11/mobile-proxy-mish",
              "source_sha": os.environ["SOURCE_SHA"],
              "lab_sha": os.environ["GITHUB_SHA"],
              "build_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "product_package": "com.mobileproxymish.app",
              "test_package": "com.mobileproxymish.app.test",
              "runner": "androidx.test.runner.AndroidJUnitRunner",
              "test_class": "com.mobileproxymish.app.cellular.CellularE3InstrumentedTest",
              "abi": os.environ["MISH_TARGET_ABI"],
              "build_type": "debug",
              "scope": "PHYSICAL_TEST_CANDIDATE_NOT_RELEASE",
              "product_apk": "app-debug.apk",
              "test_apk": "app-debug-androidTest.apk",
              "product_apk_sha256": digest(product),
              "test_apk_sha256": digest(test),
              "signing_certificate_sha256": product_cert,
          }
          Path("dist/candidate.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"product_sha256={manifest['product_apk_sha256']}\n")
              output.write(f"test_sha256={manifest['test_apk_sha256']}\n")
              output.write(f"certificate_sha256={product_cert}\n")
          PY

      - name: Upload immutable physical candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.task.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Record candidate on LAB task
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_SHA: ${{ steps.task.outputs.source_sha }}
          TASK_ID: ${{ steps.task.outputs.task_id }}
          ARTIFACT_NAME: ${{ steps.task.outputs.artifact_name }}
          PRODUCT_SHA: ${{ steps.package.outputs.product_sha256 }}
          TEST_SHA: ${{ steps.package.outputs.test_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/candidate-comment.md" <<EOF
          PRODUCT_PHYSICAL_CANDIDATE=READY

          \`TASK_ID=$TASK_ID\`
          \`SOURCE_SHA=$SOURCE_SHA\`
          \`ARTIFACT=$ARTIFACT_NAME\`
          \`PRODUCT_APK_SHA256=$PRODUCT_SHA\`
          \`TEST_APK_SHA256=$TEST_SHA\`
          \`BUILD_RUN_ID=$GITHUB_RUN_ID\`

          Scope: physical test candidate only; not a Release and not product source of truth.
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo iamaman11/mobile-proxy-mish-lab --body-file "$RUNNER_TEMP/candidate-comment.md"
