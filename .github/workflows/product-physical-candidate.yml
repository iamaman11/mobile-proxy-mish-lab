name: Product Physical Candidate

run-name: PRODUCT physical candidate request ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.number == 11 &&
      github.event.comment.user.login == 'iamaman11' &&
      !startsWith(github.event.comment.body, 'PRODUCT_')
    runs-on: ubuntu-latest
    outputs:
      request_comment_id: ${{ steps.request.outputs.request_comment_id }}
      task_id: ${{ steps.request.outputs.task_id }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      artifact_name: ${{ steps.request.outputs.artifact_name }}
      release_tag: ${{ steps.request.outputs.release_tag }}
    steps:
      - name: Parse exact PRODUCT SHA activation comment
        id: request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          REQUEST_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          body = os.environ.get("COMMENT_BODY", "")
          if re.fullmatch(r"[0-9a-f]{40}", body) is None:
              raise SystemExit("control comment must contain exactly one lowercase 40-character PRODUCT SHA")
          request_comment_id = os.environ["REQUEST_COMMENT_ID"]
          if re.fullmatch(r"[0-9]+", request_comment_id) is None:
              raise SystemExit("invalid GitHub request comment id")
          source_sha = body
          task_id = f"REQ-{request_comment_id}"
          artifact_name = f"mish-product-e3-{task_id}-{source_sha}"
          release_tag = f"physical-e3-req-{request_comment_id}"
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"request_comment_id={request_comment_id}\n")
              handle.write(f"task_id={task_id}\n")
              handle.write(f"source_sha={source_sha}\n")
              handle.write(f"artifact_name={artifact_name}\n")
              handle.write(f"release_tag={release_tag}\n")
          PY

      - name: Checkout exact PRODUCT source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iamaman11/mobile-proxy-mish
          ref: ${{ steps.request.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Verify source belongs to main and exact main CI passed
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git -C product rev-parse HEAD)"
          [[ "$ACTUAL" == "$SOURCE_SHA" ]]
          git -C product fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git -C product merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          sha = os.environ["SOURCE_SHA"]
          query = urllib.parse.urlencode({
              "head_sha": sha,
              "event": "push",
              "status": "success",
              "per_page": "100",
          })
          url = f"https://api.github.com/repos/iamaman11/mobile-proxy-mish/actions/runs?{query}"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "mobile-proxy-mish-lab-candidate-builder",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          matches = [
              run for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == sha
              and run.get("head_branch") == "main"
              and run.get("path") == ".github/workflows/ci.yml"
              and run.get("conclusion") == "success"
          ]
          if not matches:
              raise SystemExit(f"no successful exact-main CI run for {sha}")
          print(f"PRODUCT_EXACT_MAIN_CI_RUN_ID={matches[0]['id']}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle 9.6
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Install pinned Rust Android tooling
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ABI="$(sed -n 's/^mishTargetAbi=//p' product/android/gradle.properties)"
          case "$TARGET_ABI" in
            armeabi-v7a) RUST_TARGET='armv7-linux-androideabi' ;;
            arm64-v8a) RUST_TARGET='aarch64-linux-android' ;;
            *) echo "Unsupported mishTargetAbi: $TARGET_ABI" >&2; exit 1 ;;
          esac
          rustup toolchain install 1.98.1 --profile minimal
          (cd product && rustup override set 1.98.1)
          rustup target add --toolchain 1.98.1 "$RUST_TARGET"
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "MISH_TARGET_ABI=$TARGET_ABI" >> "$GITHUB_ENV"
          echo "MISH_RUST_TARGET=$RUST_TARGET" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK exactly like PRODUCT CI
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_PATH="$SDK_ROOT/ndk/29.0.14206865"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;29.0.14206865"
          test -d "$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Build exact PRODUCT and matching physical E3 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p product/android \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Verify and package exact candidate pair
        id: package
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          TASK_ID: ${{ steps.request.outputs.task_id }}
          REQUEST_COMMENT_ID: ${{ steps.request.outputs.request_comment_id }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          CONTROL_ISSUE_NUMBER: '11'
        run: |
          set -euo pipefail
          PRODUCT="product/android/app/build/outputs/apk/debug/app-debug.apk"
          TEST="product/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          NATIVE="product/android/app/build/generated/rust-jni/$MISH_TARGET_ABI/libmish_android_ffi.so"
          test -f "$PRODUCT"
          test -f "$TEST"
          test -f "$NATIVE"
          unzip -l "$PRODUCT" | grep -q "lib/$MISH_TARGET_ABI/libmish_android_ffi.so"
          unzip -l "$PRODUCT" | grep -q "lib/$MISH_TARGET_ABI/libjnidispatch.so"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$PRODUCT" | grep -q "package: name='com.mobileproxymish.app'"
          "$AAPT" dump badging "$TEST" | grep -q "package: name='com.mobileproxymish.app.test'"
          "$APKSIGNER" verify "$PRODUCT"
          "$APKSIGNER" verify "$TEST"

          mkdir -p dist
          cp "$PRODUCT" dist/app-debug.apk
          cp "$TEST" dist/app-debug-androidTest.apk

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          product = Path("dist/app-debug.apk")
          test = Path("dist/app-debug-androidTest.apk")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          sdk_root = os.environ.get("ANDROID_SDK_ROOT") or os.environ["ANDROID_HOME"]
          apksigner = Path(sdk_root) / "build-tools" / "36.0.0" / "apksigner"

          def cert_sha(path: Path) -> str:
              completed = subprocess.run(
                  [str(apksigner), "verify", "--print-certs", str(path)],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              match = re.search(r"certificate SHA-256 digest:\s*([0-9a-fA-F]+)", completed.stdout)
              if not match:
                  raise SystemExit(f"certificate SHA-256 digest missing for {path}")
              return match.group(1).lower()

          product_cert = cert_sha(product)
          test_cert = cert_sha(test)
          if product_cert != test_cert:
              raise SystemExit("PRODUCT and androidTest signing certificates differ")

          manifest = {
              "schema": "mish.product-physical-candidate/v1",
              "task_id": os.environ["TASK_ID"],
              "issue_number": int(os.environ["CONTROL_ISSUE_NUMBER"]),
              "request_comment_id": int(os.environ["REQUEST_COMMENT_ID"]),
              "source_repo": "iamaman11/mobile-proxy-mish",
              "source_sha": os.environ["SOURCE_SHA"],
              "lab_sha": os.environ["GITHUB_SHA"],
              "build_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "release_tag": os.environ["RELEASE_TAG"],
              "distribution": "LAB_GITHUB_PRERELEASE",
              "product_package": "com.mobileproxymish.app",
              "test_package": "com.mobileproxymish.app.test",
              "runner": "androidx.test.runner.AndroidJUnitRunner",
              "test_class": "com.mobileproxymish.app.cellular.CellularE3InstrumentedTest",
              "abi": os.environ["MISH_TARGET_ABI"],
              "build_type": "debug",
              "scope": "PHYSICAL_TEST_CANDIDATE_NOT_RELEASE",
              "product_apk": "app-debug.apk",
              "test_apk": "app-debug-androidTest.apk",
              "product_apk_sha256": digest(product),
              "test_apk_sha256": digest(test),
              "signing_certificate_sha256": product_cert,
          }
          Path("dist/candidate.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish immutable LAB GitHub prerelease
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          REQUEST_COMMENT_ID: ${{ steps.request.outputs.request_comment_id }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Physical test candidate derived from \`iamaman11/mobile-proxy-mish@$SOURCE_SHA\`.

          - Request comment: \`$REQUEST_COMMENT_ID\`
          - Source SHA: \`$SOURCE_SHA\`
          - LAB build run: \`$GITHUB_RUN_ID\`
          - Scope: physical DEVICE-1 test candidate only; this is a LAB prerelease, not a PRODUCT release.

          Assets are immutable for this request identity. PRODUCT source remains owned only by \`mobile-proxy-mish\`.
          EOF

          CANONICAL_DIR="dist"
          if gh release view "$RELEASE_TAG" --repo iamaman11/mobile-proxy-mish-lab >/dev/null 2>&1; then
            CANONICAL_DIR="$RUNNER_TEMP/existing-release"
            rm -rf "$CANONICAL_DIR"
            mkdir -p "$CANONICAL_DIR"
            gh release download "$RELEASE_TAG" \
              --repo iamaman11/mobile-proxy-mish-lab \
              --dir "$CANONICAL_DIR"
          else
            gh release create "$RELEASE_TAG" \
              dist/app-debug.apk \
              dist/app-debug-androidTest.apk \
              dist/candidate.json \
              --repo iamaman11/mobile-proxy-mish-lab \
              --target "$GITHUB_SHA" \
              --title "PRODUCT physical candidate REQ-$REQUEST_COMMENT_ID (${SOURCE_SHA:0:12})" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease
          fi

          CANONICAL_DIR="$CANONICAL_DIR" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["CANONICAL_DIR"])
          manifest_path = directory / "candidate.json"
          product = directory / "app-debug.apk"
          test = directory / "app-debug-androidTest.apk"
          for path in (manifest_path, product, test):
              if not path.is_file():
                  raise SystemExit(f"LAB prerelease is missing required asset: {path.name}")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = {
              "request_comment_id": int(os.environ["REQUEST_COMMENT_ID"]),
              "source_sha": os.environ["SOURCE_SHA"],
              "release_tag": os.environ["RELEASE_TAG"],
              "distribution": "LAB_GITHUB_PRERELEASE",
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"LAB prerelease manifest mismatch for {key}")
          product_sha = hashlib.sha256(product.read_bytes()).hexdigest()
          test_sha = hashlib.sha256(test.read_bytes()).hexdigest()
          if product_sha != manifest.get("product_apk_sha256"):
              raise SystemExit("LAB prerelease PRODUCT APK digest mismatch")
          if test_sha != manifest.get("test_apk_sha256"):
              raise SystemExit("LAB prerelease androidTest APK digest mismatch")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"product_sha256={product_sha}\n")
              output.write(f"test_sha256={test_sha}\n")
          PY

          if [[ "$CANONICAL_DIR" != "dist" ]]; then
            rm -rf dist
            mkdir -p dist
            cp "$CANONICAL_DIR/app-debug.apk" dist/app-debug.apk
            cp "$CANONICAL_DIR/app-debug-androidTest.apk" dist/app-debug-androidTest.apk
            cp "$CANONICAL_DIR/candidate.json" dist/candidate.json
          fi

      - name: Upload temporary Actions build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Record candidate READY on control issue
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          REQUEST_COMMENT_ID: ${{ steps.request.outputs.request_comment_id }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          PRODUCT_SHA: ${{ steps.release.outputs.product_sha256 }}
          TEST_SHA: ${{ steps.release.outputs.test_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/candidate-comment.md" <<EOF
          PRODUCT_PHYSICAL_CANDIDATE=READY

          \`REQUEST_COMMENT_ID=$REQUEST_COMMENT_ID\`
          \`SOURCE_SHA=$SOURCE_SHA\`
          \`RELEASE_TAG=$RELEASE_TAG\`
          \`PRODUCT_APK_SHA256=$PRODUCT_SHA\`
          \`TEST_APK_SHA256=$TEST_SHA\`
          \`BUILD_RUN_ID=$GITHUB_RUN_ID\`

          Canonical binaries: LAB GitHub prerelease \`$RELEASE_TAG\`. Actions artifact is temporary build evidence only.
          EOF
          gh issue comment 11 --repo iamaman11/mobile-proxy-mish-lab --body-file "$RUNNER_TEMP/candidate-comment.md"

      - name: Record terminal hosted build failure
        if: ${{ failure() && steps.request.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          REQUEST_COMMENT_ID: ${{ steps.request.outputs.request_comment_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/candidate-failed.md" <<EOF
          PRODUCT_PHYSICAL_CANDIDATE=FAILED

          \`REQUEST_COMMENT_ID=$REQUEST_COMMENT_ID\`
          \`SOURCE_SHA=$SOURCE_SHA\`
          \`BUILD_RUN_ID=$GITHUB_RUN_ID\`

          Hosted candidate build failed closed. No physical acceptance may be inferred.
          EOF
          gh issue comment 11 --repo iamaman11/mobile-proxy-mish-lab --body-file "$RUNNER_TEMP/candidate-failed.md"
