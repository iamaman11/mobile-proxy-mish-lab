name: PRODUCT cross-repo auth probe

on:
  push:
    branches:
      - fix/product-ci-verifier-auth

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prove LAB token can read PRODUCT Actions
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_SHA: be1d8b6d661efd58722812fcf5e0e87c3571007c
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/iamaman11/mobile-proxy-mish/actions/runs?head_sha=$PRODUCT_SHA&event=push&status=success&per_page=100")"
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          payload = json.loads(os.environ['RESPONSE'])
          matches = [
              run for run in payload.get('workflow_runs', [])
              if run.get('head_sha') == os.environ['PRODUCT_SHA']
              and run.get('head_branch') == 'main'
              and run.get('path') == '.github/workflows/ci.yml'
              and run.get('conclusion') == 'success'
          ]
          if not matches:
              raise SystemExit('authenticated PRODUCT exact-main CI proof missing')
          print(f"PRODUCT_EXACT_MAIN_CI_RUN_ID={matches[0]['id']}")
          PY
