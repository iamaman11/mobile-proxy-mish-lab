plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mobileproxymish.lab.devicefacts'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mobileproxymish.lab.devicefacts'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
